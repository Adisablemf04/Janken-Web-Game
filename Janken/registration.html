<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GANKEN</title>
    <link rel="stylesheet" href="css/account.css">
    <script type="module" src="js/accountForms.js"></script>
</head>
<body>
    <main class="account_page">
        <section class="account_box">
            <a href="navigation.html" class="back_link">BACK</a>
            <h1>GANKEN</h1>
            <h2>REGISTER</h2>
            <p>Create your account, before entering DEVIL DEN.</p>
            <form id="register_form" novalidate> 
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name">
                <label for="username">Username</label>
                <input type="text" id="username">
                <label for="email">Email</label>
                <input type="email" id="email">
                <label for="password">Password</label>
                <input type="password" id="password">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password">
                <p id="register_message" class="form_message"></p>
                <button type="submit" class="account_button">REGISTER</button>
            </form>
            <p class="switch_page">Already have an account? <a href="login.html">Login</a></p>
        </section>
    </main>
</body>
</html>
