<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GANKEN</title>
    <link rel="stylesheet" href="css/account.css">
    <script type="module" src="js/accountForms.js"></script>
    <script type="module" src="js/pageMusic.js"></script>
</head>
<body>
    <main class="account_page">
        <section class="account_box">
            <a href="navigation.html" class="back_link">← BACK</a>
            <h1>GANKEN</h1>
            <h2>LOGIN</h2>
            <p>Welcome, Your fate awaits.</p>
            <form id="login_form" novalidate>
                <label for="email">Email</label>
                <input type="email" id="email"autocomplete="email">
                <label for="password">Password</label>
                <input type="password" id="password"autocomplete="current-password">
                <p id="login_message" class="form_message"role="status" aria-live="polite"></p>
                <button type="submit" class="account_button">LOGIN</button>
            </form>
            <p class="switch_page">Don't have an account?<a href="registration.html">Register</a></p>
        </section>
    </main>
</body>
</html>
